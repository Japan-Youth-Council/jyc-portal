name: Mirror to Personal Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ★原因調査用のステップを追加
      - name: Debug Token Secret
        env:
          MY_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MY_TOKEN" ]; then
            echo "【エラー】 MIRROR_TOKEN が空っぽです。Secretsに正しく登録されていないか、名前が間違っています。"
            exit 1
          else
            echo "【OK】 トークンはセットされています（文字数: ${#MY_TOKEN}文字）"
          fi

      - name: Push to Personal Repo
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add target https://lindsay-yamagishi:${TOKEN}@github.com/lindsay-yamagishi/jyc-portal-deploy.git
          git push --force target HEAD:main